name: Keepalive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: DBまで到達するリクエストを送る
        run: |
          if [ -z "${{ secrets.KEEPALIVE_URL }}" ]; then
            echo "KEEPALIVE_URL が未設定のためスキップします"
            exit 0
          fi
          for i in $(seq 1 3); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -X POST "${{ secrets.KEEPALIVE_URL }}/api/user/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"keepalive@example.com","password":"keepalive-not-a-real-account"}' || true)
            if [ "$CODE" = "401" ]; then
              echo "DBまで到達しました (HTTP $CODE)"
              exit 0
            fi
            echo "再試行します... ($i/3) HTTP $CODE"
            sleep 10
          done
          echo "401 が返りませんでした。DBが停止しているか、サイトが落ちています"
          exit 1
