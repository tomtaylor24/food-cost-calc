services:
  db:
    image: mysql:8.0
    container_name: genkalc-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: genkalc
      MYSQL_USER: genkalc
      MYSQL_PASSWORD: genkalcpass
      TZ: Asia/Tokyo
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  db-data:
